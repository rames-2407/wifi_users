{% extends "base.html" %}
{% block title %}Register User{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h4>➕ Register New User</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Full Name *</label>
                                <input type="text" class="form-control" name="full_name" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Email *</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Mobile Number *</label>
                                <input type="tel" class="form-control" name="mobile" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">MAC Address *</label>
                                <input type="text" class="form-control" name="mac_address" id="mac_address" 
                                       placeholder="XX:XX:XX:XX:XX:XX" required>
                            </div>
                            <div class="invalid-feedback">
                                    Please enter a valid MAC address (e.g., 00:1A:2B:3C:4D:5E).
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Add Network *</label>
                                <select class="form-select" name="network" required>
                                    <option value="">Select Network</option>
                                    <option value="Sir Mutha School">Sir Mutha School</option>
                                    <option value="Lady Andal School">Lady Andal School</option>
                                    <option value="Concert_hall">Concert Hall</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Account Expiration (Hours) *</label>
                                <input type="number" class="form-control" name="expiration_hours" min="1" max="8760" step="0.5" value="24" required>
                                <div class="form-text text-muted">
                                        <small>Account will expire after specified hours (1-8760 hours max)</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Bandwidth *</label>
                                <select class="form-select" name="bandwidth" required>
                                    <option value="">Select Speed</option>
                                    <option value="25">25 Mbps</option>
                                    <option value="50">50 Mbps</option>
                                    <option value="75">75 Mbps</option>
                                    <option value="100">100 Mbps</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">← Back</a>
                        <button type="submit" class="btn btn-primary">Register User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
